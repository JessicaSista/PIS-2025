<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OmniMonitor</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <script>
        (function () {
            // Clave que usas en LocalStorage (debe coincidir con ThemeKey en C#)
            const ThemeKey = "currentThemeMode";

            // Lee el valor guardado de forma síncrona
            const storedMode = localStorage.getItem(ThemeKey);

            // Si el valor guardado es 'Dark', añade la clase 'dark-mode' al body inmediatamente.
            // Esto activa las variables CSS del modo oscuro definidas en app.css.
            if (storedMode === "Dark") {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>
    <link rel="icon" type="image/jpg" href="LogoSonda.jpg" />
    <link href="OmniMonitor.Client.styles.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/dnd-helpers.js"></script>
    <script src="js/theme-interop.js"></script>
</body>

<script>
    window.equalizeCardHeights = () => {
        const cards = document.querySelectorAll('.dataset-card, .kpi-card');
        let max = 0;

        cards.forEach(c => c.style.height = 'auto');

        cards.forEach(c => {
            if (c.offsetHeight > max) max = c.offsetHeight;
        });

        cards.forEach(c => c.style.height = max + 'px');
    };

    window.addEventListener('resize', () => {
        window.equalizeCardHeights();
    });
</script>

</html>
